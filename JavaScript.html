function setupPrintSiapDiambil() {
  const btnPrint = document.getElementById('btn-print-siap');
  const modal = document.getElementById('print-modal');
  const btnCancel = document.getElementById('btn-cancel-print');
  const btnClose = document.getElementById('close-print-modal');
  const btnConfirm = document.getElementById('btn-confirm-print');
  const dateInput = document.getElementById('print-date-input');

  if (!btnPrint || !modal) return;

  const closeModal = () => modal.classList.add('hidden');

  btnCancel.addEventListener('click', closeModal);
  btnClose.addEventListener('click', closeModal);

  btnPrint.addEventListener('click', () => {
    // Default to H+1 (besok)
    let tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    
    let yyyy = tomorrow.getFullYear();
    let mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
    let dd = String(tomorrow.getDate()).padStart(2, '0');
    
    dateInput.value = `${yyyy}-${mm}-${dd}`;
    modal.classList.remove('hidden');
  });

  btnConfirm.addEventListener('click', () => {
    closeModal();
    
    const printDateRaw = new Date(dateInput.value);
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateFormatted = printDateRaw.toLocaleDateString('id-ID', options).toUpperCase();
    
    const fontInput = document.getElementById('print-font-input');
    const fontSize = fontInput ? fontInput.value : '12';
    
    const paddingInput = document.getElementById('print-padding-input');
    const cellPadding = paddingInput ? paddingInput.value : '10';
    
    // Kumpulkan data dari tabel yang sedang aktif
    const tbody = document.getElementById('table-body');
    const rows = tbody.querySelectorAll('tr');
    
    let tandaTerimaList = [];
    
    rows.forEach(row => {
      // Pastikan bukan row empty state
      if (row.cells.length < 2) return;
      
      // Ambil Tanda Terima dari cell pertama (elemen div pertama yang berisi kode)
      let tandaTerima = '';
      const divKode = row.cells[0].querySelector('div');
      if (divKode) {
         tandaTerima = divKode.innerText.trim();
      } else {
         tandaTerima = row.cells[0].innerText.trim().split('\n')[0]; // fallback
      }
      if (tandaTerima && tandaTerima !== '-') {
         tandaTerimaList.push(tandaTerima);
      }
    });
    
    // Jika tidak ada data
    if (tandaTerimaList.length === 0) {
      alert("Tidak ada data untuk dicetak!");
      return;
    }
    
    // Urutkan A-Z
    tandaTerimaList.sort((a, b) => a.localeCompare(b));
    
    let tableRowsHTML = '';
    
    // Hitung jumlah baris berdasarkan 3 kolom (urut atas ke bawah)
    const numRows = Math.ceil(tandaTerimaList.length / 3);
    
    for (let i = 0; i < numRows; i++) {
       let col1 = tandaTerimaList[i] || '';
       let col2 = tandaTerimaList[i + numRows] || '';
       let col3 = tandaTerimaList[i + (2 * numRows)] || '';
       
       tableRowsHTML += `
         <tr>
           <td>${col1}</td>
           <td>${col2}</td>
           <td>${col3}</td>
         </tr>
       `;
    }
    
    const htmlContent = `
      <html>
        <head>
          <title>Daftar Siap Diambil</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              margin: 40px;
              color: #000;
            }
            .header-title {
              text-align: center;
              font-weight: bold;
              font-size: 16px;
              margin-bottom: 5px;
            }
            .header-date {
              text-align: center;
              font-size: 14px;
              font-weight: bold;
              margin-bottom: 30px;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin-top: 20px;
            }
            th, td {
              border: 1px solid #000;
              padding: ${cellPadding}px;
            }
            th {
              background-color: #ffffff; /* Putih sesuai screenshot baru */
              font-weight: bold;
              text-align: center;
              font-size: 12px;
            }
            td {
              height: 25px;
              font-size: ${fontSize}px;
              font-weight: 600;
              color: #333;
            }
            td:nth-child(1), td:nth-child(2), td:nth-child(3) { width: 33.33%; text-align: left; }
            
            @media print {
              body { margin: 0; padding: 20px; }
              @page { size: A4 portrait; margin: 15mm; }
            }
          </style>
        </head>
        <body>
          <div class="header-title">DAFTAR UNIT SIAP DIAMBIL / CANCEL</div>
          <div class="header-date">${dateFormatted}</div>
          
          <table>
            <thead>
              <tr>
                <th colspan="3">TANDA TERIMA</th>
              </tr>
            </thead>
            <tbody>
              ${tableRowsHTML}
            </tbody>
          </table>
          <scr` + `ipt>
             window.onload = function() {
               window.print();
               setTimeout(function() { window.close(); }, 500);
             };
          </scr` + `ipt>
        </body>
      </html>
    `;
    
    const printWindow = window.open('', '_blank');
    printWindow.document.open();
    printWindow.document.write(htmlContent);
    printWindow.document.close();
  });
}

function setupAlokasiUser() {
  const alokasiUserModal = document.getElementById('alokasi-user-modal');
  if(!alokasiUserModal) return;

  const closeUserAlokasi = () => { 
    alokasiUserModal.classList.add('hidden'); 
    document.getElementById('alokasi-user-tanda-terima').value = '';
    document.getElementById('alokasi-user-sn').value = '';
    document.getElementById('alokasi-user-nama-barang').value = '';
    document.getElementById('alokasi-user-tanggal').value = '';
    document.getElementById('alokasi-user-keterangan').value = '';
    document.getElementById('alokasi-user-warning').classList.add('hidden');
    document.getElementById('btn-save-alokasi-user').disabled = false;
  };

  document.getElementById('btn-alokasi-user').addEventListener('click', () => {
    alokasiUserModal.classList.remove('hidden');
    
    // Set default date to today
    const today = new Date();
    const tzOffset = today.getTimezoneOffset() * 60000; // offset in milliseconds
    const localISOTime = (new Date(today - tzOffset)).toISOString().split('T')[0];
    document.getElementById('alokasi-user-tanggal').value = localISOTime;
  });

  document.getElementById('close-alokasi-user').addEventListener('click', closeUserAlokasi);
  document.getElementById('btn-cancel-alokasi-user').addEventListener('click', closeUserAlokasi);

  const snInput = document.getElementById('alokasi-user-sn');
  const namaInput = document.getElementById('alokasi-user-nama-barang');
  const warningMsg = document.getElementById('alokasi-user-warning');
  const btnSave = document.getElementById('btn-save-alokasi-user');

  snInput.addEventListener('keyup', (e) => {
    const val = e.target.value.trim();
    if (val === "") {
      namaInput.value = "";
      warningMsg.classList.add('hidden');
      return;
    }
    
    // Cari SN di appStockData
    const found = appStockData.find(s => s.SN === val);
    if (found) {
      namaInput.value = found.Nama_Barang;
      warningMsg.classList.add('hidden');
    } else {
      namaInput.value = "";
      warningMsg.classList.remove('hidden');
    }
  });

  btnSave.addEventListener('click', () => {
    const tandaTerima = document.getElementById('alokasi-user-tanda-terima').value.trim();
    const sn = snInput.value.trim();
    const nama = namaInput.value.trim();
    const tanggal = document.getElementById('alokasi-user-tanggal').value;
    const keterangan = document.getElementById('alokasi-user-keterangan').value.trim();

    if (!tandaTerima || !sn || !nama) {
       alert("Harap lengkapi Nomor Tanda Terima, SN, dan pastikan Nama Barang terdeteksi.");
       return;
    }

    let dStr = "";
    if (tanggal) {
       const d = new Date(tanggal);
       dStr = d.getDate().toString().padStart(2, '0') + '-' + 
              (d.getMonth() + 1).toString().padStart(2, '0') + '-' + 
              d.getFullYear();
    } else {
       const today = new Date();
       dStr = today.getDate().toString().padStart(2, '0') + '-' + 
              (today.getMonth() + 1).toString().padStart(2, '0') + '-' + 
              today.getFullYear();
    }
               
    showLoading(true);
    closeUserAlokasi();
    
    if (typeof google === 'undefined') {
       appAlokasiData.push({ Tanda_Terima: tandaTerima, SN: sn, Nama_Barang: nama, Tanggal_Alokasi: dStr, Keterangan: keterangan });
       showLoading(false);
       renderAlokasiTable();
       return;
    }
    
    google.script.run
      .withFailureHandler(err => {
         showLoading(false);
         alert("Terjadi kesalahan jaringan atau script belum disimpan di Code.gs: " + err);
      })
      .withSuccessHandler(res => {
         if (res.success) {
            appAlokasiData.push({ Tanda_Terima: tandaTerima, SN: sn, Nama_Barang: nama, Tanggal_Alokasi: dStr, Keterangan: keterangan });
            showLoading(false);
            renderAlokasiTable();
            alert("Alokasi berhasil disimpan!");
         } else {
            showLoading(false);
            alert("Gagal menyimpan alokasi: " + res.error);
         }
      })
      .saveAlokasi(tandaTerima, sn, nama, dStr, keterangan);
  });
}

// Calendar Navigation Logic
function changeCalendarView(viewType) {
  // Update buttons
  const buttons = {
    monthly: document.getElementById('btn-monthly'),
    weekly: document.getElementById('btn-weekly'),
    daily: document.getElementById('btn-daily')
  };
  
  for (const key in buttons) {
    if (buttons[key]) {
      buttons[key].classList.remove('active');
    }
  }
  
  if (buttons[viewType]) {
    buttons[viewType].classList.add('active');
  }
  
  // Update views
  const views = {
    monthly: document.getElementById('calendar-monthly-view'),
    weekly: document.getElementById('calendar-weekly-view'),
    daily: document.getElementById('calendar-daily-view')
  };
  
  for (const key in views) {
    if (views[key]) {
      views[key].classList.remove('active-view');
      views[key].classList.add('hidden');
    }
  }
  
  if (views[viewType]) {
    views[viewType].classList.add('active-view');
    views[viewType].classList.remove('hidden');
  }
}

let appTodoData = [];
let todoToDelete = null;
let editingTodoId = null;

let currentTodoFilter = 'all'; // all, penting, selesai, dihapus, due-soon
let currentTodoLabelFilter = 'all'; // all, Team, Low, Medium, High
let currentTodoSort = 'newest'; // newest, oldest

function setupTodoList() {
  const btnAdd = document.getElementById('btn-add-todo');

  const btnCancel = document.getElementById('btn-cancel-todo');

      document.getElementById('todo-duedate').value = '';
      document.getElementById('todo-label').value = '';
      document.getElementById('todo-assignee').value = '';
      document.getElementById('todo-important').checked = false;
      modal.classList.remove('hidden');
    });
  }
  if (btnClose) btnClose.addEventListener('click', () => modal.classList.add('hidden'));
  if (btnCancel) btnCancel.addEventListener('click', () => modal.classList.add('hidden'));
  
  const btnConfirmDeleteTodo = document.getElementById('btn-confirm-delete-todo');
  if (btnConfirmDeleteTodo) {
    btnConfirmDeleteTodo.addEventListener('click', () => {
      if (!todoToDelete) return;
      document.getElementById('todo-delete-modal').classList.add('hidden');
      showLoading(true);
      google.script.run
        .withSuccessHandler(() => { loadTodos(); todoToDelete = null; })
        .removeTodo(todoToDelete);
    });
  }
  
  // Setup Filter Listeners
  const filterIds = {
    'filter-all': 'all',
    'filter-penting': 'penting',
    'filter-selesai': 'selesai',
    'filter-dihapus': 'dihapus',
    'filter-due-soon': 'due-soon'
  };
  for (const [id, filterVal] of Object.entries(filterIds)) {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', () => {
        if (currentTodoFilter === filterVal) return;
        
        currentTodoFilter = filterVal;
        Object.keys(filterIds).forEach(k => {
          if(document.getElementById(k)) document.getElementById(k).style.backgroundColor = '';
        });
        el.style.backgroundColor = 'var(--primary-light)';
        
        renderTodoList();
      });
    }
  }
  
  const labelIds = {
    'filter-label-Team': 'Team',
    'filter-label-Low': 'Low',
    'filter-label-Medium': 'Medium',
    'filter-label-High': 'High'
  };
  for (const [id, filterVal] of Object.entries(labelIds)) {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', () => {
        if (currentTodoLabelFilter === filterVal) {
          currentTodoLabelFilter = 'all';
          el.style.backgroundColor = '';
        } else {
          currentTodoLabelFilter = filterVal;
          Object.keys(labelIds).forEach(k => {
            if(document.getElementById(k)) document.getElementById(k).style.backgroundColor = '';
          });
          el.style.backgroundColor = 'var(--primary-light)';
        }
        renderTodoList();
      });
    }
  }
  
  const btnSort = document.getElementById('btn-sort-todo');
  if (btnSort) {
    btnSort.addEventListener('click', () => {
      if (currentTodoSort === 'newest') {
        currentTodoSort = 'oldest';
        btnSort.innerHTML = 'Terlama <i class="fas fa-chevron-up"></i>';
      } else {
        currentTodoSort = 'newest';
        btnSort.innerHTML = 'Terbaru <i class="fas fa-chevron-down"></i>';
      }
      renderTodoList();
    });
  }
  
  if (btnSave) {
    btnSave.addEventListener('click', () => {
      const title = document.getElementById('todo-title').value;
      if (!title) return alert("Judul tugas tidak boleh kosong");
      
      const data = {
        Title: title,
        Due_Date: document.getElementById('todo-duedate').value,
        Labels: document.getElementById('todo-label').value,
        Assignees: document.getElementById('todo-assignee').value,
        Is_Important: document.getElementById('todo-important').checked,
        Created_By: (typeof localStorage !== 'undefined' ? localStorage.getItem('loggedUsername') : 'Admin') || 'Admin'
      };
      
      modal.classList.add('hidden');
      
      if (editingTodoId) {
        // Optimistic update for Edit
        const task = appTodoData.find(t => t.Task_ID === editingTodoId);
        if (task) {
          task.Title = data.Title;
          task.Due_Date = data.Due_Date;
          task.Labels = data.Labels;
          task.Assignees = data.Assignees;
          task.Is_Important = data.Is_Important ? 'TRUE' : 'FALSE';
          renderTodoList();
        }
        
        google.script.run
          .withSuccessHandler(res => {
            if (res.success) {
              showToast('Tugas berhasil diperbarui');
            } else {
              showToast('Gagal memperbarui: ' + res.error, true);
              loadTodos(); // reload if failed
            }
          })
          .withFailureHandler(err => {
            showToast('Error: ' + err, true);
            loadTodos();
          })
          .editTodo(editingTodoId, data);
          
      } else {

        showLoading(true);
        google.script.run
          .withSuccessHandler(res => {
            showLoading(false);
            if (res.success) {
              loadTodos();
            } else {
              alert("Gagal menyimpan task: " + res.error);
            }
          })
          .withFailureHandler(err => {
            showLoading(false);
            alert("Error: " + err);
          })

      }
    });
  }
}

  google.script.run
    .withSuccessHandler(data => {
      showLoading(false);

      renderTodoList();
    })
    .withFailureHandler(err => {
      showLoading(false);
      console.error(err);
    })
    .getTodos();
}

function renderTodoList() {
  const container = document.getElementById('todo-list-container');
  if (!container) return;
  
  container.innerHTML = '';
  
  let filteredTodos = appTodoData;
  
  // Apply Status Filter
  if (currentTodoFilter === 'dihapus') {
    filteredTodos = filteredTodos.filter(t => t.Status === 'Removed');
  } else {
    filteredTodos = filteredTodos.filter(t => t.Status !== 'Removed');
    
    if (currentTodoFilter === 'penting') {
      filteredTodos = filteredTodos.filter(t => t.Is_Important === true || t.Is_Important === 'TRUE');
    } else if (currentTodoFilter === 'selesai') {
      filteredTodos = filteredTodos.filter(t => t.Status === 'Completed');
    } else if (currentTodoFilter === 'due-soon') {
      const today = new Date();
      const threeDaysLater = new Date();
      threeDaysLater.setDate(today.getDate() + 3);
      
      filteredTodos = filteredTodos.filter(t => {
        if (t.Status === 'Completed' || !t.Due_Date) return false;
        try {
          // Parse DD/MM/YYYY hh:mm or MM/DD/YYYY from strings
          let dateStr = t.Due_Date;
          if (dateStr.includes(' ')) dateStr = dateStr.split(' ')[0]; // Ambil bagian tanggal
          
          let parts;
          if (dateStr.includes('/')) parts = dateStr.split('/');
          else if (dateStr.includes('-')) parts = dateStr.split('-');
          else return false;
          
          let dueDate;
          if (parts[2] && parts[2].length === 4) { // format DD/MM/YYYY
            dueDate = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
          } else if (parts[0] && parts[0].length === 4) { // format YYYY/MM/DD
            dueDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
          } else {
            dueDate = new Date(dateStr); // Fallback
          }
          
          return dueDate <= threeDaysLater && dueDate >= new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
        } catch(e) {
          return false;
        }
      });
    }
  }
  
  // Apply Label Filter
  if (currentTodoLabelFilter !== 'all') {
    filteredTodos = filteredTodos.filter(t => t.Labels === currentTodoLabelFilter);
  }
  
  // Apply Sort (Completed tasks always at the bottom)
  filteredTodos.sort((a, b) => {
    const isACompleted = a.Status === 'Completed';
    const isBCompleted = b.Status === 'Completed';
    
    if (isACompleted && !isBCompleted) return 1;
    if (!isACompleted && isBCompleted) return -1;
    
    let dateA = new Date(a.Created_Date || 0);
    let dateB = new Date(b.Created_Date || 0);
    if (isNaN(dateA.getTime())) dateA = new Date(0);
    if (isNaN(dateB.getTime())) dateB = new Date(0);
    
    return currentTodoSort === 'newest' ? dateB - dateA : dateA - dateB;
  });
  
  if (filteredTodos.length === 0) {
    container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">Belum ada task.</div>';
    return;
  }
  
  filteredTodos.forEach(task => {
    const isCompleted = task.Status === 'Completed';
    const isImportant = task.Is_Important === true || task.Is_Important === 'TRUE';
    
    let labelsHtml = '';
    if (task.Labels) {
      const color = task.Labels === 'High' ? '#ef4444' : task.Labels === 'Medium' ? '#f59e0b' : task.Labels === 'Low' ? '#10b981' : 'var(--primary)';
      const bg = task.Labels === 'High' ? '#fee2e2' : task.Labels === 'Medium' ? '#fef3c7' : task.Labels === 'Low' ? '#d1fae5' : 'var(--primary-light)';
      labelsHtml += `<span style="background: ${bg}; color: ${color}; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px;"><i class="fas fa-tag"></i> ${task.Labels}</span>`;
    }
    
    if (isImportant) {
      labelsHtml += `<span style="background: #fef3c7; color: #f59e0b; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px;"><i class="fas fa-exclamation-circle"></i> Penting</span>`;
    }
    
    let assigneesHtml = '';
    if (task.Assignees) {
      assigneesHtml += '<div style="display: flex;">';
      const parts = task.Assignees.split(',');
      parts.forEach((p, idx) => {
        assigneesHtml += `<div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-left: ${idx>0?'-10px':'0'}; z-index: ${10-idx};">${p.trim().substring(0,2).toUpperCase()}</div>`;
      });
      assigneesHtml += '</div>';
    }
    
    const div = document.createElement('div');
    div.style.background = 'var(--panel-bg)';
    div.style.borderRadius = '16px';
    div.style.padding = '20px';
    div.style.display = 'flex';
    div.style.alignItems = 'center';
    div.style.justifyContent = 'space-between';
    div.style.boxShadow = 'var(--soft-shadow)';
    div.style.marginBottom = '15px';
    
    div.innerHTML = `
      <div style="display: flex; align-items: center; gap: 20px;">
        <input type="checkbox" onchange="toggleTodo('${task.Task_ID}', this.checked)" ${isCompleted ? 'checked' : ''} class="custom-checkbox">
        <div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">${task.Created_Date || ''} ${task.Due_Date ? ' | Due: ' + task.Due_Date : ''}</div>
          <div style="font-size: 15px; font-weight: 600; color: var(--text-main); ${isCompleted ? 'text-decoration: line-through; opacity: 0.7;' : ''}">${task.Title}</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 15px;">
        ${labelsHtml}
        ${assigneesHtml}
        <button onclick="editTodoTask('${task.Task_ID}')" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 16px; margin-right: 5px;"><i class="fas fa-edit"></i></button>
        <button onclick="removeTodoTask('${task.Task_ID}')" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px;"><i class="fas fa-trash"></i></button>
      </div>
    `;
    container.appendChild(div);
  });
}

window.toggleTodo = function(id, isChecked) {
  const status = isChecked ? 'Completed' : 'Active';
  
  // Optimistic UI Update
  const task = appTodoData.find(t => t.Task_ID === id);
  if (task) {
    task.Status = status;
    renderTodoList(); // re-render immediately to reflect changes and apply sort
  }
  
  // Background Request
  google.script.run
    .withSuccessHandler(() => {
      showToast('Tugas berhasil diperbarui');
    })
    .withFailureHandler((err) => {
      // Revert if failed
      if (task) {
        task.Status = isChecked ? 'Active' : 'Completed';
        renderTodoList();
      }
      showToast('Gagal memperbarui tugas', true);
      console.error(err);
    })
    .updateTodoStatus(id, status);
}

window.showToast = function(message, isError = false) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  
  const toast = document.createElement('div');
  toast.className = 'toast' + (isError ? ' toast-error' : '');
  
  const icon = document.createElement('i');
  icon.className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
  if (!isError) icon.style.color = '#10b981'; // Green for success
  
  const text = document.createElement('span');
  text.textContent = message;
  
  toast.appendChild(icon);
  toast.appendChild(text);
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => {
      toast.remove();
    }, 300);
  }, 3000);
}

window.removeTodoTask = function(id) {
  todoToDelete = id;
  const modalText = document.querySelector('#todo-delete-modal .modal-body p');
  const modalBtn = document.getElementById('btn-confirm-delete-todo');
  if (modalText && modalBtn) {
    if (currentTodoFilter === 'dihapus') {
      modalText.textContent = "Apakah Anda yakin ingin menghapus tugas ini secara permanen dari database?";
      modalBtn.textContent = "Hapus Permanen";
    } else {
      modalText.textContent = "Apakah Anda yakin ingin memindahkan tugas ini ke tempat sampah (Dihapus)?";
      modalBtn.textContent = "Hapus";
    }
  }
  document.getElementById('todo-delete-modal').classList.remove('hidden');
}

window.editTodoTask = function(id) {
  const task = appTodoData.find(t => t.Task_ID === id);
  if (!task) return;
  
  editingTodoId = id;
  const headerText = document.querySelector('#todo-modal .modal-header h2');
  if(headerText) headerText.textContent = 'Edit Task';
  
  document.getElementById('todo-title').value = task.Title || '';
  
  // Format Date for datetime-local input
  let formattedDate = '';
  if (task.Due_Date) {
    try {
      // Due_Date is formatted as dd/MM/yyyy HH:mm from backend
      const parts = task.Due_Date.split(' ');
      if (parts.length === 2) {
        const dateParts = parts[0].split('/');
        if (dateParts.length === 3) {
          formattedDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1]}`;
        }
      }
    } catch(e) {}
  }
  document.getElementById('todo-duedate').value = formattedDate;
  
  document.getElementById('todo-label').value = task.Labels || '';
  document.getElementById('todo-assignee').value = task.Assignees || '';
  document.getElementById('todo-important').checked = task.Is_Important === true || task.Is_Important === 'TRUE';
  
  document.getElementById('todo-modal').classList.remove('hidden');
}

</script>
